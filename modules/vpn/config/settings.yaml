# ============================================================================
# Enterprise BunyanX - VPN Module Reference Defaults
# ============================================================================
#
# ⚠️  هذا الملف للتوثيق فقط — لا يُقرأ من الكود مباشرةً.
#
# الإعدادات الفعلية النشطة موجودة في:
#   ➜  system/config/base.yaml  (قسم vpn: على المستوى الأعلى)
#
# هذا الملف يوثّق جميع المعاملات المتاحة وقيمها الافتراضية كمرجع للمطوّر.
# ============================================================================

# المعاملات المتاحة في system/config/base.yaml تحت قسم vpn:
#
# vpn:
#   enabled: false              # تفعيل WireGuard عند الإقلاع
#   interface: "wg0"            # اسم الـ network interface
#   listen_port: 51820          # منفذ WireGuard UDP (1024-65535)
#   ip_address: "10.10.0.1/24" # IP الخادم داخل النفق + Subnet
#   dns: ""                     # DNS يُرسَل للـ Peers (اختياري)
#   mtu: 1420                   # MTU (1280-1500, الافتراضي 1420 يتجنب التجزئة)
#   portal:
#     allow_multi_session: false  # false = جلسة واحدة لكل مستخدم
#     session_ttl_seconds: 86400  # مدة صلاحية الجلسة (افتراضي 24 ساعة)
#
# ============================================================================
# ملاحظات هامة:
# ============================================================================
#
# 1. المفتاح الخاص (private_key) لا يُخزَّن في أي ملف config أو DB.
#    يُولَّد في الذاكرة عبر WireGuardManager ويُكتب مؤقتاً إلى ملف عشوائي
#    عبر mkstemp() بصلاحيات 0o600 أثناء إعداد الـ interface ثم يُحذف فوراً
#    في finally block — بدون أسماء متوقعة (لا symlink/race attacks).
#
# 2. لتفعيل VPN، عدّل base.yaml:
#       vpn:
#         enabled: true   ← هذا السطر فقط
#
# 3. بيانات الـ Peers (public keys, allowed IPs) تُخزَّن في قاعدة
#    البيانات (جدول vpn_peers) وتُستعاد تلقائياً عند الإقلاع.
#
# 4. مفاتيح الـ Preshared Key تُشفَّر عند التخزين في DB عبر Fernet.
#    لإعداد مفتاح التشفير: اضبط VPN_PSK_KEY في ملف .env
#    أو سيُشتق تلقائياً من JWT_SECRET.
#
# 5. منفذ WireGuard (51820 UDP) مُضاف تلقائياً في:
#       ebpf.port_filter.allowed_ports  ← base.yaml
#
# 6. جميع المدخلات (public_key, allowed_ips, endpoint) تُفحص
#    عبر validators.py قبل الوصول لـ WireGuard CLI أو قاعدة البيانات.
# ============================================================================
